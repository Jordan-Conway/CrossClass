name: PR Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: ./.ci/install_dependencies.sh
      
      - name: Run Tests
        run: ./.ci/test.sh
